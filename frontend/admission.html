<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Admission</title>
  <link rel="stylesheet" href="admission.css" />
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo"></div>
    <span class="topbar-title">UEP Registrar Admin</span>
    <input class="search-bar" type="text" placeholder="Search" />
  </div>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="8" height="8" rx="1"/>
              <rect x="13" y="3" width="8" height="8" rx="1"/>
              <rect x="3" y="13" width="8" height="8" rx="1"/>
              <rect x="13" y="13" width="8" height="8" rx="1"/>
            </svg>
          </span>
          <span>Dashboard</span>
        </a>
        <a href="admission.html" class="nav-item active">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
            </svg>
          </span>
          <span>Admission</span>
        </a>
        <a href="profiling.html" class="nav-item">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </span>
          <span>Profiling</span>
        </a>
        <a href="requests.html" class="nav-item">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </span>
          <span>Requests</span>
        </a>
      </nav>
      <a href="#" class="logout">Logout</a>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- BLUE BANNER -->
      <div class="blue-banner">
        <div class="page-title">ADMISSION</div>
      </div>

      <!-- CONTENT -->
      <div class="content-area">

        <div class="table-actions">
          <button class="btn-action">⚙ FILTERS</button>
          <button class="btn-action">⬆ EXPORT</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Admission No.</th>
                <th>Name</th>
                <th>Year Graduated</th>
                <th>Date Added</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" class="no-data">No data available.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer">
          <span>Rows per page: 8</span>
          <span>0-0 of 0</span>
          <button class="page-btn" disabled>&#8249;</button>
          <button class="page-btn" disabled>&#8250;</button>
        </div>

      </div>

    </main>
  </div>

</body>
</html>
