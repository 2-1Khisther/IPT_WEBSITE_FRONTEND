<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Admission Log Engine</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="ueplogo.png" class="logo" alt="Logo" />
    </div>
    <span class="topbar-title">UEP Registrar Admin</span>
    <input type="text" id="input-admission-search" class="search-bar" placeholder="Search admissions..." />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="admission.html" class="nav-item active">
          <span class="nav-icon">📄</span>
          <span>Admission</span>
        </a>
        <a href="profiling.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span>Profiling</span>
        </a>
        <a href="requests.html" class="nav-item">
          <span class="nav-icon">📁</span>
          <span>Requests</span>
        </a>
      </nav>
      <div class="sidebar-actions">
        <a href="selection.html" class="sidebar-action" data-admin-only="true" hidden>Change Module</a>
        <a href="#" class="sidebar-action" data-action="logout">Log out</a>
      </div>
    </aside>

    <main class="main">
      <div class="blue-banner">
        <div class="page-title">ADMISSION</div>
      </div>

      <div class="content-area">
        <div class="table-actions">
          <button id="action-admission-filter" class="btn-action">⚙ FILTERS</button>
          <button id="action-admission-export" class="btn-action">⬆ EXPORT</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Admission No.</th>
                <th>Name</th>
                <th>Year Graduated</th>
                <th>Date Added</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="target-admission-rows">
              </tbody>
          </table>
        </div>

        <div class="table-footer">
          <span>Rows per page: 
            <select id="config-admission-pagesize">
              <option value="8">8</option>
              <option value="15">15</option>
            </select>
          </span>
          <span id="txt-admission-pagination">0-0 of 0</span>
          <button id="btn-admission-prev" class="page-btn" disabled>&#8249;</button>
          <button id="btn-admission-next" class="page-btn" disabled>&#8250;</button>
        </div>
      </div>
    </main>
  </div>

  <template id="template-admission-row">
    <tr>
      <td class="col-id"></td>
      <td class="col-admission-no"></td>
      <td class="col-name"></td>
      <td class="col-year"></td>
      <td class="col-date-added"></td>
      <td><a href="#" class="btn-view route-view-btn">View</a></td>
    </tr>
  </template>

  <script src="app-integration.js" defer></script>
</body>
</html>
