<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - University Registry</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="ueplogo.png" class="logo" alt="Logo" />
    </div>
    <span class="topbar-title">UEP Registrar Admin</span>
    <input type="text" id="input-registry-search" class="search-bar" placeholder="Search registry records..." />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <a href="archiving-dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="archiving-university-registry.html" class="nav-item active">
          <span class="nav-icon">📄</span>
          <span>University Registry</span>
        </a>
        <a href="archiving.html" class="nav-item">
          <span class="nav-icon">🗄️</span>
          <span>Archiving</span>
        </a>
        <a href="archiving-system-integrity.html" class="nav-item">
          <span class="nav-icon">📋</span>
          <span>System Integrity</span>
        </a>
      </nav>
      <a href="selection.html" class="logout">↩ Change Module</a>
    </aside>

    <main class="main">
      <div class="blue-banner">
        <div class="page-title">UNIVERSITY REGISTRY</div>
      </div>

      <div class="content-area">
        <div class="table-actions">
          <button id="action-registry-filter" class="btn-action">⚙ FILTERS</button>
          <button id="action-registry-export" class="btn-action">⬆ EXPORT</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>College</th>
                <th>Year Level</th>
                <th>Enrollment Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="target-registry-rows">
              </tbody>
          </table>
        </div>

        <div class="table-footer">
          <span>Rows per page: 
            <select id="config-registry-pagesize"><option>8</option><option>16</option></select>
          </span>
          <span id="txt-registry-pagination">0-0 of 0</span>
          <button id="btn-registry-prev" class="page-btn" disabled>◄</button>
          <button id="btn-registry-next" class="page-btn" disabled>►</button>
        </div>
      </div>
    </main>
  </div>

  <template id="template-registry-row">
    <tr>
      <td class="col-student-id"></td>
      <td class="col-name"></td>
      <td class="col-course"></td>
      <td class="col-college"></td>
      <td class="col-year-level"></td>
      <td class="col-enrollment-status"></td>
      <td><button class="btn-view action-view-student">View</button></td>
    </tr>
  </template>

</body>
</html>
