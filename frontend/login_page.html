<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin</title>
  <link rel="stylesheet" href="login_page.css" />
</head>
<body>

  <div class="page">

    <!-- Top blue banner -->
    <div class="banner"></div>

    <!-- Login card -->
    <div class="card">

      <!-- Logo placeholder (replace img src with your logo file) -->
      <div class="logo-wrapper">
        <img src="frontend/ueplogo.png" alt="UEP Logo" class="logo" />
      </div>

      <h1 class="title">UEP Registrar Admin</h1>

      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />
      </div>

      <button class="btn-login" type="button" onclick="window.location.href='dashboard.html'">Login</button>

    </div>

    <!-- Bottom grey section -->
    <div class="bottom"></div>

  </div>

</body>
</html>
