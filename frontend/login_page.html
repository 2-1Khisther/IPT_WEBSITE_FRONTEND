<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Gateway</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body>

  <div class="page">
    <div class="login-banner"></div>

    <div class="login-card">
      <div class="logo-wrapper">
        <img src="ueplogo.png" alt="UEP Logo" class="logo" />
      </div>

      <h1 class="title">UEP Registrar Admin</h1>

      <form id="form-auth-submission" onsubmit="window.location.href='selection.html'; return false;">
        <div class="form-group">
          <label for="input-auth-user">Username:</label>
          <input type="text" id="input-auth-user" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="input-auth-pass">Password:</label>
          <input type="password" id="input-auth-pass" autocomplete="current-password" required />
        </div>

        <button id="btn-auth-execute" class="btn-login" type="submit">Login</button>
      </form>
    </div>

    <div class="login-bottom"></div>
  </div>

</body>
</html>
