<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Subsystem Selection</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body class="selection-body">

  <div class="selection-top-banner">
    <div class="selection-university-logo">
      <img src="ueplogo.png" alt="UEP University Seal" />
    </div>
    <h1>UEP Registrar Admin</h1>
    <p>Please select what you want to use</p>
  </div>

  <div class="selection-grid-container">
    
    <a href="dashboard.html" class="selection-card-button" id="portal-route-monitoring">
      <div class="selection-card-icon-frame">
        <img src="monitoring.png" alt="System Infrastructure Monitor Icon" />
      </div>
      <div class="selection-card-title">System Monitoring and Management</div>
      <div class="selection-card-desc">(Profiling, Admission, Requests)</div>
    </a>

    <a href="archiving-dashboard.html" class="selection-card-button" id="portal-route-archiving">
      <div class="selection-card-icon-frame">
        <img src="archiving.png" alt="Archiving Vault Storage Icon" />
      </div>
      <div class="selection-card-title">Archiving</div>
      <div class="selection-card-desc">Execute long-term storage validation routines and structural database security tracing</div>
    </a>

  </div>

</body>
</html>
