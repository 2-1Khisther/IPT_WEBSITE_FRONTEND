<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Document Requests</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="ueplogo.png" class="logo" alt="Logo" />
    </div>
    <span class="topbar-title">UEP Registrar Admin</span>
    <input type="text" id="input-request-search" class="search-bar" placeholder="Search requests..." />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="admission.html" class="nav-item">
          <span class="nav-icon">📄</span>
          <span>Admission</span>
        </a>
        <a href="profiling.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span>Profiling</span>
        </a>
        <a href="requests.html" class="nav-item active">
          <span class="nav-icon">📁</span>
          <span>Requests</span>
        </a>
      </nav>
      <a href="selection.html" class="logout">↩ Change Module</a>
    </aside>

    <main class="main">
      <div class="blue-banner">
        <div class="page-title">REQUESTS</div>
      </div>

      <div class="content-area">
        <div class="table-actions">
          <button id="action-request-filter" class="btn-action">⚙ FILTERS</button>
          <button id="action-request-export" class="btn-action">⬆ EXPORT</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Date Requested</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="target-request-rows">
              </tbody>
          </table>
        </div>

        <div class="table-footer">
          <span>Rows per page: <select id="config-request-pagesize"><option>8</option></select></span>
          <span id="txt-request-pagination">0-0 of 0</span>
          <button id="btn-request-prev" class="page-btn" disabled>◄</button>
          <button id="btn-request-next" class="page-btn" disabled>►</button>
        </div>
      </div>
    </main>
  </div>

  <template id="template-request-row">
    <tr>
      <td class="col-student-id"></td>
      <td class="col-name"></td>
      <td class="col-date"></td>
      <td class="col-status"></td>
      <td>
        <button class="btn-view route-view-btn">View</button>
        <button class="btn-action route-edit-status" style="display:inline-block; margin-left:6px; color:var(--green);">Edit Status</button>
      </td>
    </tr>
  </template>

  <script src="app-integration.js" defer></script>
</body>
</html>
