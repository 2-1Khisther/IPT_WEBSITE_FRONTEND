<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP Registrar Admin - Profiling Engine</title>
  <link rel="stylesheet" href="production-system.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="ueplogo.png" class="logo" alt="Logo" />
    </div>
    <span class="topbar-title">UEP Registrar Admin</span>
    <input type="text" id="input-profiling-search" class="search-bar" placeholder="Search profiles..." />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="admission.html" class="nav-item">
          <span class="nav-icon">📄</span>
          <span>Admission</span>
        </a>
        <a href="profiling.html" class="nav-item active">
          <span class="nav-icon">👤</span>
          <span>Profiling</span>
        </a>
        <a href="requests.html" class="nav-item">
          <span class="nav-icon">📁</span>
          <span>Requests</span>
        </a>
      </nav>
      <a href="#" class="logout">Logout</a>
    </aside>

    <main class="main">
      <div class="blue-banner">
        <div class="page-title">PROFILING</div>
      </div>

      <div class="content-area">
        <div class="table-actions">
          <button id="action-profiling-filter" class="btn-action">⚙ FILTERS</button>
          <button id="action-profiling-export" class="btn-action">⬆ EXPORT</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Date Added</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="target-profiling-rows">
              </tbody>
          </table>
        </div>

        <div class="table-footer">
          <span>Rows per page: 
            <select id="config-profiling-pagesize"><option value="8">8</option><option value="15">15</option></select>
          </span>
          <span id="txt-profiling-pagination">0-0 of 0</span>
          <button id="btn-profiling-prev" class="page-btn" disabled>&#8249;</button>
          <button id="btn-profiling-next" class="page-btn" disabled>&#8250;</button>
        </div>
      </div>
    </main>
  </div>

  <template id="template-profiling-row">
    <tr>
      <td class="col-student-id"></td>
      <td class="col-name"></td>
      <td class="col-date-added"></td>
      <td><a href="#" class="btn-view route-view-btn">View</a></td>
    </tr>
  </template>

</body>
</html>
